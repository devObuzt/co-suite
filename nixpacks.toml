[variables]
PYTHON_VERSION = "3.12"
NODE_VERSION = "22"

[phases.setup]
aptPkgs = [
  "libasound2",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libcairo2",
  "libcups2",
  "libdbus-1-3",
  "libdrm2",
  "libexpat1",
  "libfontconfig1",
  "libgbm1",
  "libglib2.0-0",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libpango-1.0-0",
  "libx11-6",
  "libxcb1",
  "libxcomposite1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxkbcommon0",
  "libxrandr2"
]
nixPkgs = [
  "python312",
  "python312Packages.pip",
  "python312Packages.virtualenv",
  "ffmpeg",
  "nodejs_22",
  "git",
  "alsa-lib",
  "atk",
  "at-spi2-atk",
  "cairo",
  "cups",
  "dbus",
  "expat",
  "fontconfig",
  "glib",
  "gtk3",
  "libdrm",
  "xorg.libX11",
  "xorg.libxcb",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "libxkbcommon",
  "mesa",
  "nspr",
  "nss",
  "pango"
]

[phases.install]
cmds = [
  "virtualenv /opt/venv",
  "/opt/venv/bin/pip install -r requirements.txt",
  "rm -rf web && git clone --depth 1 https://github.com/devObuzt/co-suite-web.git web",
  "cd web && npm ci"
]

[start]
cmd = "/opt/venv/bin/uvicorn api.main:app --host 0.0.0.0 --port $PORT"
