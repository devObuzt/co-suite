[variables]
PYTHON_VERSION = "3.12"
NODE_VERSION = "22"

[phases.setup]
# NOTE: no aptPkgs. The Chromium/Remotion shared libs below are all provided by
# nixPkgs (gtk3, nss, nspr, cairo, pango, atk, mesa, xorg.*), so the apt list was
# pure duplication — and apt fetches from archive.ubuntu.com, which intermittently
# fails the build over IPv6 ("Network is unreachable"). Dropping apt removes that
# whole failure mode and speeds the build. Add libs here ONLY if Nix lacks them.
nixPkgs = [
  "python312",
  "python312Packages.pip",
  "python312Packages.virtualenv",
  "ffmpeg",
  "nodejs_22",
  "git",
  "alsa-lib",
  "atk",
  "at-spi2-atk",
  "cairo",
  "cups",
  "dbus",
  "expat",
  "fontconfig",
  "glib",
  "gtk3",
  "libdrm",
  "xorg.libX11",
  "xorg.libxcb",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "libxkbcommon",
  "mesa",
  "nspr",
  "nss",
  "pango"
]

[phases.install]
cmds = [
  "virtualenv /opt/venv",
  "/opt/venv/bin/pip install -r requirements.txt",
  "rm -rf web && git clone --depth 1 https://github.com/devObuzt/co-suite-web.git web",
  "cd web && npm ci"
]

[start]
cmd = "/opt/venv/bin/uvicorn api.main:app --host 0.0.0.0 --port $PORT"
