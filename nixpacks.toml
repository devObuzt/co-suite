[variables]
PYTHON_VERSION = "3.12"
NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "ffmpeg", "nodejs_22"]

[phases.install]
cmds = [
  "python -m pip install -r requirements.txt",
  "cd web && npm ci"
]

[start]
cmd = "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
